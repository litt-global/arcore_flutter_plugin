plugins {
    id 'com.android.library'
    id 'kotlin-android'
}

group = 'com.gorisse.thomas.sceneform'
version = '1.23.0'

android {
    namespace "com.google.ar.sceneform"
    compileSdk 31
    compileSdkVersion 31

    defaultConfig {
        // Sceneform requires minSdk >= 24.
        minSdk 24
        targetSdk 31

        consumerProguardFiles 'lib-proguard-rules.pro'

        buildConfigField 'String', 'VERSION_NAME', "\"${project.properties['VERSION_NAME']}\""
    }
    compileOptions {
        // Sceneform libraries use language constructs from Java 8.
        // Add these compile options if targeting minSdk < 26.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources {
        noCompress 'filamat', 'ktx'
    }
}

dependencies {
    //TODO: Remove it
    implementation files("libs/libsceneform_runtime_schemas.jar")

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-jdk8:1.10.2"

    // Filament
    api "com.google.android.filament:filament-android:1.57.1"
    api "com.google.android.filament:gltfio-android:1.57.1"
    api "com.google.android.filament:filament-utils-android:1.57.1"

    // ARCore
    api "com.google.ar:core:1.50.0"

    // AndroidX
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.2"

    // Fuel
    implementation "com.github.kittinunf.fuel:fuel:2.3.1"
    implementation "com.github.kittinunf.fuel:fuel-android:2.3.1"
    implementation "com.github.kittinunf.fuel:fuel-coroutines:2.3.1"
}